name = "monarch-warehouse-module"
# Loop 45/46: bumped from 2024-09-01 - Cloudflare's own docs require
# compatibility_date >= 2024-09-23 for nodejs_compat to actually enable
# Node.js compatibility (AsyncLocalStorage etc.), which the OpenNext
# Cloudflare adapter depends on. Deliberately NOT bumped to today's date -
# that would pull in newer, untested runtime behavior changes this loop
# has no way to verify against; only the documented minimum is taken.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Loop 45/46: OpenNext Cloudflare adapter build output (`npx
# opennextjs-cloudflare build`) - the real Workers entrypoint that wraps
# this Next.js app, and its static asset bundle. Neither existed before
# this loop; `npm run build` alone (plain `next build`) does not produce
# them - `opennextjs-cloudflare build` must run first.
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Real Cloudflare D1 database (Loop 27) - created via the Cloudflare
# connector after Alpesh explicitly pointed out it was connected and
# asked why it was unused; the 4 migrations were applied directly
# against it and re-verified (SKFG rejection, stock_ledger append-only
# triggers) with the same checks Loop 7 first ran locally. Local dev
# still uses `--local` / the app's own local-D1 connection
# (src/lib/db.ts) by default - this binding only makes the id real so
# a genuine `--remote` command targets the right database; it does not
# by itself mean the deployed app is wired to it (PEN-020 - no
# @cloudflare/next-on-pages-style adapter exists yet) or that anything
# has been deployed (still NOT DEPLOYED per the free-only gate).
[[d1_databases]]
binding = "DB"
database_name = "monarch-warehouse-module"
database_id = "3947a2dd-a29d-4dd2-9af0-49895548f0e2"
migrations_dir = "drizzle/migrations"
